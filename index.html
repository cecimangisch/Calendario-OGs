<style>

  .linkb{appearance:none;border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:650;

  .picker{display:flex;flex-wrap:wrap;gap:6px}

<body>
<div class="wrap">
  <h1>¿Dónde estamos?</h1>
  <p class="sub" id="sub">Noviembre 2026 – Febrero 2027 · el color es la ciudad</p>
  <div id="app"></div>
</div>


<script>
(function(){
"use strict";

/* ---------- dates ---------- */
var DAY = 86400000;
function u(s){var p=String(s).split("-");return Date.UTC(+p[0],+p[1]-1,+p[2]);}
var START = u("2026-11-01"), NDAYS = 120;
function at(i){return new Date(START+i*DAY);}
function iso(d){return d.toISOString().slice(0,10);}
function ix(s){var v=Math.round((u(s)-START)/DAY);return v;}
var WD = ["D","L","M","X","J","V","S"];
var MN = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var MS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fmt(i){var d=at(i);return d.getUTCDate()+" "+MS[d.getUTCMonth()];}
function isWe(i){var w=at(i).getUTCDay();return w===0||w===6;}
var TODAY = (function(){var n=new Date();return Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-START)/DAY);})();

/* ---------- state ---------- */
var S = {cities:[],people:[],base:null,v:1};
var LOADED=false, DOCVER=0;

var TEXT_ON = {0:"#fff",1:"#fff",2:"#fff",3:"#fff",4:"#0b0b0b",5:"#fff",6:"#fff",7:"#fff",8:"#fff"};
function cvar(slot){return "var(--c"+slot+")";}
function cityById(id){for(var i=0;i<S.cities.length;i++) if(S.cities[i].id===id) return S.cities[i]; return null;}
function nextSlot(){
  var used={},i;
  for(i=0;i<S.cities.length;i++) used[S.cities[i].slot]=1;
  for(i=1;i<=8;i++) if(!used[i]) return i;
  return ((S.cities.length)%8)+1;
}
function uid(p){return p+Math.random().toString(36).slice(2,8);}
function slugCode(name){
  var base=name.trim().replace(/[^A-Za-zÁÉÍÓÚÜÑáéíóúüñ ]/g,"");
  var parts=base.split(/\s+/).filter(Boolean);
  var c = parts.length>1 ? (parts[0][0]+parts[1][0]+(parts[1][1]||"")) : base.slice(0,3);
  c=c.toUpperCase();
  var taken={},i;
  for(i=0;i<S.cities.length;i++) taken[S.cities[i].code]=1;
  var out=c,n=2; while(taken[out]){out=c.slice(0,2)+n;n++;}
  return out;
}

/* ---------- derived ---------- */
var D = {};
function compute(){
  var byDay = [], i, j, k;
  for(i=0;i<NDAYS;i++){ byDay.push({}); }
  for(i=0;i<S.people.length;i++){
    var p=S.people[i], st=p.stays||[];
    for(j=0;j<st.length;j++){
      var a=ix(st[j].from), b=ix(st[j].to);
      if(isNaN(a)||isNaN(b)) continue;
      if(b<a){var t=a;a=b;b=t;}
      a=Math.max(0,a); b=Math.min(NDAYS-1,b);
      for(k=a;k<=b;k++){
        var m=byDay[k]; if(!m[st[j].city]) m[st[j].city]=[];
        if(m[st[j].city].indexOf(p.id)<0) m[st[j].city].push(p.id);
      }
    }
  }
  var max=0;
  for(i=0;i<NDAYS;i++) for(var c in byDay[i]) if(byDay[i][c].length>max) max=byDay[i][c].length;
  D.byDay=byDay; D.max=max;
  D.lanes={};
  for(i=0;i<S.people.length;i++) D.lanes[S.people[i].id]=packLanes(S.people[i].stays||[]);
}
function packLanes(stays){
  var items=[],i;
  for(i=0;i<stays.length;i++){
    var a=ix(stays[i].from), b=ix(stays[i].to);
    if(isNaN(a)||isNaN(b)) continue;
    if(b<a){var t=a;a=b;b=t;}
    if(b<0||a>NDAYS-1) continue;
    items.push({a:Math.max(0,a),b:Math.min(NDAYS-1,b),city:stays[i].city});
  }
  items.sort(function(x,y){return x.a-y.a;});
  var lanes=[];
  for(i=0;i<items.length;i++){
    var placed=false;
    for(var L=0;L<lanes.length;L++){
      var last=lanes[L][lanes[L].length-1];
      if(items[i].a>last.b){lanes[L].push(items[i]);placed=true;break;}
    }
    if(!placed) lanes.push([items[i]]);
  }
  return lanes;
}
function cityCount(ci,day){var a=D.byDay[day][ci];return a?a.length:0;}

/* Split a city's timeline into stretches where the exact set of people is the
   same, then group the stretches that share a set. Each group is one real
   cohort, so the headcount and the names always agree. */
function cohorts(fromToday){
  var lo = fromToday ? Math.max(0,Math.min(TODAY,NDAYS-1)) : 0;
  var res=[];
  S.cities.forEach(function(ct){
    var segs=[], curKey=null, curStart=-1, i;
    for(i=lo;i<=NDAYS;i++){
      var ids = i<NDAYS ? (D.byDay[i][ct.id]||[]).slice().sort() : [];
      var key = ids.length>=2 ? ids.join(",") : null;
      if(key!==curKey){
        if(curKey!==null) segs.push({key:curKey,a:curStart,b:i-1});
        curKey=key; curStart=i;
      }
    }
    if(!segs.length) return;
    var groups={};
    segs.forEach(function(s){
      if(!groups[s.key]) groups[s.key]={ids:s.key.split(","),runs:[],days:0};
      groups[s.key].runs.push({a:s.a,b:s.b});
      groups[s.key].days += s.b-s.a+1;
    });
    var list=[],k;
    for(k in groups) list.push(groups[k]);
    list.sort(function(x,y){
      return y.ids.length-x.ids.length || y.days-x.days || x.runs[0].a-y.runs[0].a;
    });
    var maxK=0;
    list.forEach(function(g){ if(g.ids.length>maxK) maxK=g.ids.length; });
    res.push({city:ct,maxK:maxK,groups:list});
  });
  res.sort(function(a,b){return b.maxK-a.maxK;});
  return res;
}
function fmtRange(a,b){
  var da=at(a),db=at(b);
  if(a===b) return fmt(a);
  if(da.getUTCMonth()===db.getUTCMonth()) return da.getUTCDate()+"–"+db.getUTCDate()+" "+MS[db.getUTCMonth()];
  return fmt(a)+"–"+fmt(b);
}
function pname(id){for(var i=0;i<S.people.length;i++) if(S.people[i].id===id) return S.people[i].name; return "?";}
function nameList(ids){
  var n=ids.map(pname).sort(function(a,b){return a.localeCompare(b,"es");});
  if(n.length<=1) return n.join("");
  return n.slice(0,-1).join(", ")+" y "+n[n.length-1];
}

/* ---------- Supabase ---------- */
/* The whole calendar is one jsonb document per `cal` id, guarded by a version
   number: a save only lands if nobody else saved since we last read. Reads and
   writes go through two SQL functions, so the anon key alone is not enough —
   you also need the calendar id that lives in the page's URL. */
var SB=null, CAL=null, saveTimer=null, dirty=false, pollTimer=null, lastErr=null;

function setStatus(msg,cls){
  var e=document.getElementById("status");
  if(e){e.textContent=msg||""; e.className="status "+(cls||"");}
  var g=document.getElementById("gstatus");
  if(g){g.textContent=msg||""; g.className="gstatus "+(cls||"");}
}
function calFromHash(){
  var h=(location.hash||"").replace(/^#/,"").trim();
  return /^[a-z0-9]{6,40}$/i.test(h) ? h : null;
}
function newCal(){
  var s="",c="abcdefghijklmnopqrstuvwxyz0123456789";
  for(var i=0;i<10;i++) s+=c.charAt(Math.floor(Math.random()*c.length));
  return s;
}
function configured(){
  return typeof CONFIG!=="undefined" && CONFIG && CONFIG.url && CONFIG.key
    && CONFIG.url.indexOf("TU-PROYECTO")<0;
}
function boot(){
  if(!configured()){
    fatal("Falta configurar Supabase. Abrí config.js y poné la URL y la anon key de tu proyecto.");
    return;
  }
  if(!window.supabase || !window.supabase.createClient){
    fatal("No se pudo cargar la librería de Supabase. Revisá la conexión y recargá.");
    return;
  }
  SB = window.supabase.createClient(CONFIG.url, CONFIG.key);
  CAL = calFromHash();
  if(!CAL){ CAL=newCal(); try{ location.replace("#"+CAL); }catch(e){ location.hash=CAL; } }
  load(true);
  /* a handful of people editing now and then — polling beats a realtime socket */
  pollTimer=setInterval(function(){ if(!document.hidden) load(false); }, 8000);
  window.addEventListener("focus",function(){ load(false); });
}
function fatal(msg){
  var app=document.getElementById("app");
  if(!app) return;
  app.textContent="";
  var c=document.createElement("div"); c.className="card";
  var d=document.createElement("div"); d.className="empty"; d.textContent=msg;
  c.appendChild(d); app.appendChild(c);
}
function applyDoc(row){
  var doc = row && row.doc ? row.doc : null;
  if(!doc){ doc={cities:[],people:[],base:null,v:1}; }
  if(!doc.cities) doc.cities=[];
  if(!doc.people) doc.people=[];
  S=doc; DOCVER = row && row.version ? row.version : 0;
}
/* Don't yank the page out from under someone who is typing. */
function busyEditing(){
  var a=document.activeElement;
  if(!a) return false;
  var t=(a.tagName||"").toLowerCase();
  return t==="input"||t==="select"||t==="textarea";
}
function load(first){
  if(!SB) return;
  if(dirty && !first) return;
  SB.rpc("cal_get",{p_cal:CAL}).then(function(res){
    if(res.error){ lastErr=res.error.message;
      if(first) fatal("No pude leer el calendario: "+res.error.message);
      else setStatus("Sin conexión con Supabase.","err");
      return; }
    lastErr=null;
    var row=res.data;
    var ver = row && row.version ? row.version : 0;
    if(!first && ver===DOCVER) return;        /* nothing new */
    if(!first && busyEditing()){ return; }    /* pick it up on the next tick */
    applyDoc(row);
    LOADED=true;
    render();
    if(!first) setStatus("Actualizado con los cambios de otra persona.","");
  }).catch(function(e){
    if(first) fatal("No pude conectar con Supabase. Revisá la URL y la anon key en config.js.");
  });
}
function save(){
  dirty=true;
  setStatus("Guardando…","");
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,900);
}
function doSave(){
  if(!SB){ setStatus("Sin conexión: los cambios no se guardaron.","err"); return; }
  SB.rpc("cal_put",{p_cal:CAL, p_doc:S, p_version:DOCVER}).then(function(res){
    if(res.error){ setStatus("No se pudo guardar: "+res.error.message,"err"); return; }
    var out=res.data;
    if(out && out.conflict){
      /* somebody saved between our read and our write — theirs wins, show it */
      applyDoc(out.current); dirty=false; render();
      setStatus("Otra persona guardó al mismo tiempo. Se cargó su versión; revisá tu cambio.","err");
      return;
    }
    DOCVER = out && out.version ? out.version : DOCVER+1;
    dirty=false;
    setStatus("Guardado ✓","ok");
  }).catch(function(){ setStatus("No se pudo guardar. Revisá la conexión.","err"); });
}

function personById(id){for(var i=0;i<S.people.length;i++) if(S.people[i].id===id) return S.people[i]; return null;}
function citySelect(val){
  var sel=el("select");
  S.cities.forEach(function(ct){ var o=el("option",null,ct.name); o.value=ct.id; sel.appendChild(o); });
  if(val) sel.value=val;

function dateInput(v){
  var d=el("input"); d.type="date"; d.min="2026-11-01"; d.max="2027-02-28";
  d.value=v||"2026-12-01"; return d;
}
function lastEnd(p){
  var mx=null;
  (p.stays||[]).forEach(function(s){ if(mx===null||ix(s.to)>ix(mx)) mx=s.to; });
  if(mx===null) return "2026-12-01";
  var n=ix(mx)+1; if(n>NDAYS-1) n=NDAYS-1; if(n<0) n=0;
  return iso(at(n));
}
function stayRow(p,s){
  var r=el("div","stay");
  var ct=cityById(s.city);
  var sw=el("span","sw"); sw.style.background=ct?cvar(ct.slot):"var(--muted)"; r.appendChild(sw);
  var g=el("div","g"); g.style.display="flex"; g.style.flexWrap="wrap"; g.style.gap="5px"; g.style.alignItems="center";
  var cs=citySelect(s.city);
  cs.onchange=function(){ s.city=cs.value; save(); render(); };
  var d1=dateInput(s.from);
  d1.onchange=function(){ if(d1.value){ s.from=d1.value; save(); render(); } };
  var d2=dateInput(s.to);
  d2.onchange=function(){ if(d2.value){ s.to=d2.value; save(); render(); } };
  g.appendChild(cs); g.appendChild(d1); g.appendChild(el("span","tiny","→")); g.appendChild(d2);
  var a=Math.max(0,ix(s.from)), b=Math.min(NDAYS-1,ix(s.to));
  if(!isNaN(a)&&!isNaN(b)&&b>=a) g.appendChild(el("span","tiny",(b-a+1)+" d"));
  r.appendChild(g);
  var x=el("button","del","×"); x.title="Borrar tramo";
  x.onclick=function(){ p.stays=p.stays.filter(function(z){return z!==s;}); save(); render(); };
  r.appendChild(x);
  return r;
}
function fillGaps(p){
  var base=S.base||(S.cities[0]&&S.cities[0].id); if(!base) return;
  var covered=new Array(NDAYS), i;
  (p.stays||[]).forEach(function(s){
    var a=ix(s.from), b=ix(s.to);
    if(isNaN(a)||isNaN(b)) return;
    if(b<a){var t=a;a=b;b=t;}
    a=Math.max(0,a); b=Math.min(NDAYS-1,b);
    for(i=a;i<=b;i++) covered[i]=1;
  });
  p.stays=p.stays||[];
  var s0=-1;
  for(i=0;i<=NDAYS;i++){
    var on = i<NDAYS && !covered[i];
    if(on && s0<0) s0=i;
    if(!on && s0>=0){ p.stays.push({city:base,from:iso(at(s0)),to:iso(at(i-1))}); s0=-1; }
  }
}

    var nmi=el("input"); nmi.value=p.name; nmi.style.flex="1"; nmi.style.minWidth="150px"; nmi.style.fontWeight="650";
    nmi.onchange=function(){ var v=nmi.value.trim(); if(v&&v!==p.name){ p.name=v; save(); render(); } };
    var nl=el("label","f"); nl.style.flex="1"; nl.appendChild(el("span",null,"Nombre")); nl.appendChild(nmi);
    nr.appendChild(nl);
    var dl=el("button","b ghost","Borrar a "+p.name);
    dl.style.color="var(--c8)"; dl.style.alignSelf="flex-end";
    dl.onclick=function(){
      if(dl.getAttribute("data-c")==="1"){
        S.people=S.people.filter(function(z){return z.id!==p.id;});
        selPerson=null; save(); render();
      } else { dl.setAttribute("data-c","1"); dl.textContent="¿Seguro? Tocá otra vez"; }
    };
    nr.appendChild(dl);
    card.appendChild(nr);

    var box=el("div","stays"); box.style.marginTop="9px";
    var sorted=(p.stays||[]).slice().sort(function(a,b){return ix(a.from)-ix(b.from);});
    if(!sorted.length) box.appendChild(el("div","tiny","Sin tramos todavía. Agregá uno abajo."));
    sorted.forEach(function(s){ box.appendChild(stayRow(p,s)); });
    card.appendChild(box);

    var f=el("div","row"); f.style.marginTop="9px";
    var sel=citySelect(S.base||(S.cities[0]&&S.cities[0].id));
    var l1=el("label","f"); l1.appendChild(el("span",null,"Ciudad")); l1.appendChild(sel);
    var d1=dateInput(lastEnd(p));
    var l2=el("label","f"); l2.appendChild(el("span",null,"Desde")); l2.appendChild(d1);
    var d2=dateInput(lastEnd(p));
    var l3=el("label","f"); l3.appendChild(el("span",null,"Hasta")); l3.appendChild(d2);
    var b=el("button","b","+ Tramo"); b.style.alignSelf="flex-end";
    b.onclick=function(){
      if(!sel.value||!d1.value||!d2.value) return;
      p.stays=p.stays||[];
      p.stays.push({city:sel.value,from:d1.value,to:d2.value});
      save(); render();
    };
    f.appendChild(l1); f.appendChild(l2); f.appendChild(l3); f.appendChild(b);
    card.appendChild(f);

    var base=cityById(S.base||"");
    if(base){
      var gaps=el("button","b ghost","Completar huecos con "+base.name);
      gaps.style.marginTop="9px";
      gaps.onclick=function(){ fillGaps(p); save(); render(); };
      card.appendChild(gaps);
    }
  } else if(people.length){
    card.appendChild(el("p","tiny","Tocá un nombre para ver y cambiar sus tramos."));
  }

  /* --- 3. cities --- */
  card.appendChild(el("div","step","3 · Ciudades"));
  var cl=el("div","picker");
  S.cities.forEach(function(ct){
    var tag=el("span","ctag");
    var sw=el("span","sw"); sw.style.background=cvar(ct.slot); tag.appendChild(sw);
    tag.appendChild(el("span",null,ct.name));
    if((S.base||"")===ct.id) tag.appendChild(el("span","basetag","base"));
    var inUse=S.people.some(function(q){return (q.stays||[]).some(function(s){return s.city===ct.id;});});
    if(!inUse){
      var x=el("button","del","×"); x.title="Quitar ciudad";
      x.onclick=function(){
        S.cities=S.cities.filter(function(z){return z.id!==ct.id;});
        if(S.base===ct.id) S.base=S.cities[0]?S.cities[0].id:null;
        save(); render();
      };
      tag.appendChild(x);
    }
    cl.appendChild(tag);
  });
  card.appendChild(cl);
  var cr=el("div","row"); cr.style.marginTop="8px";
  var cin=el("input"); cin.placeholder="Agregar ciudad"; cin.style.flex="1"; cin.style.minWidth="130px";
  var cbt=el("button","b ghost","+ Ciudad");
  function addC(){ var v=cin.value.trim(); if(!v) return; addCity(v); cin.value=""; save(); render(); }
  cbt.onclick=addC; cin.onkeydown=function(e){ if(e.key==="Enter"){e.preventDefault();addC();} };
  cr.appendChild(cin); cr.appendChild(cbt);
  if(S.cities.length>1){
    var bl=el("label","f");
    bl.appendChild(el("span",null,"Ciudad base"));
    var bs=citySelect(S.base);
    bs.onchange=function(){ S.base=bs.value; save(); render(); };
    bl.appendChild(bs); cr.appendChild(bl);
  }
  card.appendChild(cr);

  /* --- bulk --- */
  var imp=el("details","imp"); imp.style.marginTop="14px";
  imp.appendChild(el("summary",null,"Pegar varios tramos de golpe"));
  var ta=el("textarea");
  ta.placeholder="Flor | Buenos Aires | 20/12 - 8/1\nFlor | Madrid | 9/1 - 28/2\nLu | Córdoba | 24/12 - 2/1";
  var ib=el("button","b","Agregar estas líneas");
  var ierr=el("div","err");
  ib.onclick=function(){
    var res=parseBulk(ta.value);
    ierr.textContent = res.errors.length ? ("No entendí: "+res.errors.join(" · ")) : "";
    if(res.added){ ta.value=""; save(); render(); }
  };
  imp.appendChild(ta);
  imp.appendChild(el("p","tiny","Nombre | Ciudad | desde - hasta. Fechas 20/12 o 20/12/2026 (nov y dic = 2026; ene y feb = 2027). Si el nombre ya existe, le suma el tramo."));
  imp.appendChild(ib); imp.appendChild(ierr);
  card.appendChild(imp);

  card.appendChild(el("div","step","4 · Compartir"));
  card.appendChild(el("p","tiny","Cualquiera con este link entra y edita, sin cuenta ni contraseña. Si se lo reenvían a alguien más, esa persona también puede editar."));
  var sr=el("div","row");
  var sb=el("button","b ghost","Copiar link del calendario");
  sb.onclick=function(){
    var t=shareLink();
    try{ navigator.clipboard.writeText(t).then(function(){
      sb.textContent="Link copiado ✓"; setTimeout(function(){sb.textContent="Copiar link del calendario";},1800);
    }).catch(function(){ sb.textContent=t; }); }
    catch(e){ sb.textContent=t; }
  };
  sr.appendChild(sb);
  card.appendChild(sr);

  var st=el("div","status"); st.id="status"; card.appendChild(st);
  return card;
}
function addCity(name){
  var found=null;
  S.cities.forEach(function(c){ if(c.name.toLowerCase()===name.toLowerCase()) found=c; });
  if(found) return found;
  var c={id:uid("c"),name:name,code:slugCode(name),slot:nextSlot()};
  S.cities.push(c);
  return c;
}
function parseDate(tok){
  var m=String(tok).trim().match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
  if(!m) return null;
  var d=+m[1], mo=+m[2], y=m[3]?+m[3]:null;
  if(mo<1||mo>12||d<1||d>31) return null;
  if(y===null) y = (mo>=11)?2026:2027;
  else if(y<100) y=2000+y;
  var s=y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  var i=ix(s);
  if(isNaN(i)) return null;
  return s;
}
function parseBulk(text){
  var lines=String(text).split(/\r?\n/), errors=[], added=0;
  lines.forEach(function(line,n){
    if(!line.trim()) return;
    var parts = line.indexOf("|")>=0 ? line.split("|") : (line.indexOf("\t")>=0 ? line.split("\t") : line.split(";"));
    if(parts.length<3){ errors.push("línea "+(n+1)); return; }
    var who=parts[0].trim(), city=parts[1].trim(), range=parts.slice(2).join(" ").trim();
    var rm=range.split(/\s*(?:-|–|a|al|hasta)\s*/i).filter(Boolean);
    if(rm.length<2){ errors.push("línea "+(n+1)); return; }
    var a=parseDate(rm[0]), b=parseDate(rm[rm.length-1]);
    if(!who||!city||!a||!b){ errors.push("línea "+(n+1)); return; }
    var ct=addCity(city);
    var p=null;
    S.people.forEach(function(z){ if(z.name.toLowerCase()===who.toLowerCase()) p=z; });
    if(!p){ p={id:uid("p"),name:who,stays:[]}; S.people.push(p); }
    p.stays=p.stays||[];
    p.stays.push({city:ct.id,from:a,to:b});
    added++;
  });
  return {errors:errors,added:added};
}

/* ---------- go ---------- */
var rt=null;
window.addEventListener("resize",function(){ if(rt)clearTimeout(rt); rt=setTimeout(function(){ if(LOADED) render(); },180); });
boot();
})();
</script>
